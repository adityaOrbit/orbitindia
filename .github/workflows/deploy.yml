name: Deploy to GitHub Pages

# Runs from the testing branch only (main keeps its own original workflow).
# Publishes two versions of the site to one GitHub Pages site:
#   - the main branch, unchanged, at the site root   (…/orbitindia/)
#   - the testing branch under /preview/              (…/orbitindia/preview/)

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main
      - name: Check out testing
        id: testing
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: testing
          path: site-testing
      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-main/package-lock.json

      - name: Build main (site root)
        working-directory: site-main
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID || '' }}
          # Google Apps Script web app "Orbit Website Forms" (owner: seo@orbitindia.com).
          # A repository variable of the same name overrides it.
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMS_ENDPOINT || 'https://script.google.com/macros/s/AKfycby0dcU28M0wL58rnO81WVbWFSgGmYOGPPsoBGAXEZniCxCSj5nLGwTpD0LJL5Iwy6J-/exec' }}

      - name: Build testing (/preview)
        if: steps.testing.outcome == 'success'
        working-directory: site-testing
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/preview
          NEXT_PUBLIC_GTM_ID: ""
          NEXT_PUBLIC_FORMS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMS_ENDPOINT || 'https://script.google.com/macros/s/AKfycby0dcU28M0wL58rnO81WVbWFSgGmYOGPPsoBGAXEZniCxCSj5nLGwTpD0LJL5Iwy6J-/exec' }}

      - name: Combine both builds
        run: |
          mkdir -p dist
          cp -r site-main/out/. dist/
          if [ -d site-testing/out ]; then
            mkdir -p dist/preview
            cp -r site-testing/out/. dist/preview/
          fi
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
